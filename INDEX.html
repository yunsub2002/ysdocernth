<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VALUE HTS — 한·미 가치주 트레이딩 터미널 (실시세)</title>
<style>
:root{--bg:#0A0F17;--pn:#101722;--pn2:#0D131D;--ln:#1C2635;--ln2:#26334A;--tx:#D6DEE9;--dim:#7F90A6;--mut:#56657A;--up:#FF4B4B;--dn:#3D8BFF;--acc:#F2B53A;--ok:#2FD08C;--sel:#1B2A40;--mono:'D2Coding','Consolas','SF Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:12px;overflow:hidden}

.mode{margin-left:auto;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:4px}.mode.demo{background:#3A1717;color:#FF9A8A;border:1px solid #6B2A2A}.mode.live{background:#0F3322;color:var(--ok);border:1px solid #1E6B47}
.app{display:grid;grid-template-columns:300px 1fr 292px;grid-template-rows:1fr 272px;height:calc(100% - 40px - 22px)}
aside,section{min-width:0;min-height:0}
#wl{grid-row:1;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column}

input,select{font:inherit;background:var(--pn2);color:var(--tx);border:1px solid var(--ln2);border-radius:3px;padding:4px 6px}input:focus,select:focus{outline:1px solid var(--acc)}

.btn{font:inherit;font-weight:800;font-size:12px;padding:6px 10px;border-radius:3px;border:1px solid var(--ln2);background:#162131;color:var(--tx);cursor:pointer}.btn:hover{border-color:var(--acc)}.btn.buy{background:#5A1B1B;border-color:#8A2B2B;color:#FFD0CA}.btn.sell{background:#15305A;border-color:#24508F;color:#CFE2FF}.btn.acc{background:#3A2E10;border-color:#7A5E1A;color:var(--acc)}

table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:4px 7px;border-bottom:1px solid #161F2C;white-space:nowrap}th{position:sticky;top:0;background:#0F1621;color:var(--dim);font-weight:800;text-align:right;cursor:pointer;user-select:none}th:first-child,td:first-child{text-align:left}td{text-align:right}tbody tr{cursor:pointer}tbody tr:hover{background:#131C29}

.note b{color:var(--tx)}
a{color:#7FB2FF}
footer{height:22px;display:flex;align-items:center;gap:14px;padding:0 10px;background:#070B11;border-top:1px solid var(--ln);font-size:11px;color:var(--mut)}
footer #st{margin-left:auto;color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}.modal.on{display:flex}.modal>div{background:var(--pn);border:1px solid var(--ln2);border-radius:6px;padding:14px 16px;width:min(420px,92vw)}

::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#223047;border-radius:5px}::-webkit-scrollbar-track{background:transparent}

/* ===== 모바일(휴대폰) 레이아웃 ===== */
#ghUp{display:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:4px;background:#3A2E10;color:var(--acc);border:1px solid #7A5E1A;text-decoration:none;white-space:nowrap}
@media (max-width:900px){
 html,body{height:auto;overflow:auto;font-size:13px}
 header{height:auto;flex-wrap:wrap;gap:6px 10px;padding:7px 10px;position:sticky;top:0;z-index:20}

 footer{height:auto;flex-wrap:wrap;padding:6px 10px;line-height:1.5}
}
</style></head><body>
<header><div class="logo">VALUE<b>·</b>HTS <span style="font-size:11px;color:var(--acc)">매일 추천 스캐너</span></div><div class="clk"><span id="kst"></span><span id="est"></span></div><div class="mode demo" id="mode">샘플 데이터 · 실제 시세 아님</div></header>

</section>
<aside id="rp"><div class="box" id="recWrap"><h4><span>추천 사유</span><span id="recAt" style="color:var(--mut)"></span></h4><div id="recBox"></div></div>

</aside>
<section id="bottom"><div class="btabs" id="bt"><button data-b="rec" class="on">오늘의 추천 리포트</button><button data-b="scr">가치주 스크리너</button><button data-b="api">데이터 연결</button><button data-b="wlm">관심종목 관리</button><button data-b="pf">모의매매 잔고·체결</button><button data-b="info">종목 정보·뉴스</button></div><div class="bc" id="bc"></div></section>
</div>

<script>
'use strict';
const BAKED=/*@BAKED*/null/*@/BAKED*/;
// ================= 기본 종목 =================
const DEF_WATCH=[
 ['005930','삼성전자','KOSPI'],['000660','SK하이닉스','KOSPI'],['005380','현대차','KOSPI'],['000270','기아','KOSPI'],['012330','현대모비스','KOSPI'],['105560','KB금융','KOSPI'],['055550','신한지주','KOSPI'],['086790','하나금융지주','KOSPI'],['316140','우리금융지주','KOSPI'],['033780','KT&G','KOSPI'],['030200','KT','KOSPI'],['017670','SK텔레콤','KOSPI'],['035420','NAVER','KOSPI'],['035720','카카오','KOSPI'],['051910','LG화학','KOSPI'],['003550','LG','KOSPI'],
 ['247540','에코프로비엠','KOSDAQ'],['086520','에코프로','KOSDAQ'],['196170','알테오젠','KOSDAQ'],['028300','HLB','KOSDAQ'],['263750','펄어비스','KOSDAQ'],['035900','JYP Ent.','KOSDAQ'],
 ['AAPL','Apple','NASDAQ'],['MSFT','Microsoft','NASDAQ'],['NVDA','NVIDIA','NASDAQ'],['GOOGL','Alphabet','NASDAQ'],['AMZN','Amazon','NASDAQ'],['META','Meta','NASDAQ'],['INTC','Intel','NASDAQ'],['CSCO','Cisco','NASDAQ'],['CMCSA','Comcast','NASDAQ'],
 ['BRK.B','Berkshire Hathaway B','NYSE'],['JPM','JPMorgan Chase','NYSE'],['BAC','Bank of America','NYSE'],['KO','Coca-Cola','NYSE'],['JNJ','Johnson & Johnson','NYSE'],['PG','Procter & Gamble','NYSE'],['XOM','Exxon Mobil','NYSE'],['CVX','Chevron','NYSE'],['VZ','Verizon','NYSE'],['WMT','Walmart','NYSE'],['PFE','Pfizer','NYSE']
].map(([code,name,mkt])=>({code,name,mkt,api:''}));
if(BAKED&&BAKED.watch&&BAKED.watch.length){DEF_WATCH.length=0;BAKED.watch.forEach(w=>DEF_WATCH.push(Object.assign({api:''},w)))}
const KRM=m=>m==='KOSPI'||m==='KOSDAQ';
const CUR=w=>KRM(w.mkt)?'KRW':'USD';
// ================= 상태 =================
const LS='value_hts_v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
let S=Object.assign({watch:DEF_WATCH,bars:{},fund:{},draw:{},api:{prov:'none',key:'',refresh:60},paper:{cash:{KRW:100000000,USD:100000},pos:{},log:[]},ui:{sym:'005930',tf:'D',ind:{ma5:1,ma20:1,ma60:1,ma120:0,bb:0,vol:1},sub:'RSI',wl:'ALL',magnet:0,lock:0},scr:{perMax:15,pbrMax:1.5,roeMin:0,divMin:0,debtMax:200,mkt:'ALL',preset:'custom',sort:'score',dir:-1}},lsGet()||{});
if(BAKED){const user=(S.watch||[]).filter(w=>w.user&&!DEF_WATCH.some(b=>b.code===w.code));const apis={};(S.watch||[]).forEach(w=>{if(w.api)apis[w.code]=w.api});S.watch=DEF_WATCH.map(w=>Object.assign({},w,{api:apis[w.code]||''})).concat(user)}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){status('저장 공간 부족 — 오래된 시세 데이터를 지우세요',1)}}
const $=q=>document.querySelector(q);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(t,bad){const e=$('#st');e.textContent=t;e.style.color=bad?'#FF8A7A':'var(--dim)'}
// ================= 포맷 =================
const fmtN=(v,d=0)=>v==null||isNaN(v)?'-':(+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtP(v,w){return KRM(w.mkt)?fmtN(v,0):fmtN(v,2)}
function fmtBig(v,cur){if(v==null||isNaN(v))return'-';if(cur==='KRW'){if(Math.abs(v)>=1e12)return(v/1e12).toFixed(1)+'조';if(Math.abs(v)>=1e8)return fmtN(v/1e8,0)+'억';return fmtN(v)}if(Math.abs(v)>=1e12)return'$'+(v/1e12).toFixed(2)+'T';if(Math.abs(v)>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(Math.abs(v)>=1e6)return'$'+(v/1e6).toFixed(1)+'M';return'$'+fmtN(v)}
const cls=v=>v>0?'up':v<0?'dn':'fl';const sgn=v=>v>0?'▲':v<0?'▼':'';
const dstr=t=>{const d=new Date(t);return d.getUTCFullYear()+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'+String(d.getUTCDate()).padStart(2,'0')};
// ================= 샘플 데이터 (가상) =================
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tickKR(p){return p<2000?1:p<5000?5:p<20000?10:p<50000?50:p<200000?100:p<500000?500:1000}
function genBars(w){const r=rng(hash(w.code));const kr=KRM(w.mkt);let p=kr?(5000+r()*195000):(15+r()*480);const days=[];const d=new Date();d.setUTCHours(0,0,0,0);while(days.length<760){const wd=d.getUTCDay();if(wd!==0&&wd!==6)days.push(d.getTime());d.setUTCDate(d.getUTCDate()-1)}days.reverse();
 const bars=[];let trend=(r()-.5)*0.0012,vol=0.014+r()*0.012;const baseV=kr?(2e5+r()*3e6):(2e6+r()*4e7);

function readText(f,cb){const r=new FileReader();r.onload=()=>{let t=r.result;if(/�/.test(t.slice(0,400))){const r2=new FileReader();r2.onload=()=>cb(r2.result);r2.readAsText(f,'euc-kr');return}cb(t)};r.readAsText(f,'utf-8')}
function splitCSV(line){const out=[];let cur='',q=false;for(const ch of line){if(ch==='"')q=!q;else if((ch===','||ch==='\t')&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())}
const numv=s=>{if(s==null)return null;s=String(s).replace(/[,%\s원$배]/g,'');if(s===''||s==='-'||s.toUpperCase()==='N/A')return null;const v=parseFloat(s);return isNaN(v)?null:v};
function parseDate(s){s=String(s).trim().replace(/[./]/g,'-');let m=s.match(/^(\d{4})-?(\d{1,2})-?(\d{1,2})/);if(m)return Date.UTC(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);if(m)return Date.UTC(+m[3],+m[1]-1,+m[2]);const d=Date.parse(s);return isNaN(d)?null:Date.UTC(new Date(d).getFullYear(),new Date(d).getMonth(),new Date(d).getDate())}
function colIdx(h,names){const H=h.map(x=>x.toLowerCase().replace(/\s/g,''));for(const n of names){const i=H.findIndex(x=>x===n.toLowerCase());if(i>=0)return i}for(const n of names){const i=H.findIndex(x=>x.includes(n.toLowerCase()));if(i>=0)return i}return-1}
function importBars(text,name){const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<3){status('데이터가 부족합니다',1);return}const h=splitCSV(lines[0]);const I={t:colIdx(h,['date','날짜','일자']),o:colIdx(h,['open','시가']),hi:colIdx(h,['high','고가']),l:colIdx(h,['low','저가']),c:colIdx(h,['close','종가','adjclose','현재가']),v:colIdx(h,['volume','거래량'])};if(I.t<0||I.c<0){status('날짜·종가 열을 찾지 못했습니다',1);return}
 const bars=[];for(let k=1;k<lines.length;k++){const c=splitCSV(lines[k]);const t=parseDate(c[I.t]);const cl=numv(c[I.c]);if(t==null||cl==null)continue;const o=I.o>=0?numv(c[I.o])??cl:cl,hh=I.hi>=0?numv(c[I.hi])??cl:cl,ll=I.l>=0?numv(c[I.l])??cl:cl;bars.push({t,o,h:Math.max(hh,o,cl),l:Math.min(ll,o,cl),c:cl,v:I.v>=0?numv(c[I.v])||0:0})}

function importFund(text,name){const lines=text.split(/\r?\n/).filter(l=>l.trim());const h=splitCSV(lines[0]);const I={c:colIdx(h,['종목코드','코드','symbol','ticker','code']),n:colIdx(h,['종목명','name','회사명']),m:colIdx(h,['시장','market']),per:colIdx(h,['per']),pbr:colIdx(h,['pbr']),roe:colIdx(h,['roe']),div:colIdx(h,['배당수익률','배당','dividend','div']),debt:colIdx(h,['부채비율','debt']),opm:colIdx(h,['영업이익률','opm','operatingmargin']),mc:colIdx(h,['시가총액','시총','marketcap'])};if(I.c<0){status('종목코드 열을 찾지 못했습니다',1);return}

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key;if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();$('#wlQ').focus();return}if(k==='Escape'){CH.draft=null;setTool('cursor');draw()}else if(k==='Delete'||k==='Backspace'){if(CH.sel>=0){e.preventDefault();$('#delSel').click()}}else if(k==='t'||k==='T')setTool('trend');else if(k==='r'||k==='R')setTool('ray');else if(k==='h'||k==='H')setTool('hline');else if(k==='v'||k==='V')setTool('vline');else if(k==='f'||k==='F')setTool('fib');else if(k==='b'||k==='B')setTool('rect');else if(k==='+'||k==='='){CH.n=Math.max(15,CH.n/1.2);draw()}else if(k==='-'){CH.n=Math.min(CH.bars.length+40,CH.n*1.2);draw()}else if(k==='ArrowLeft'){CH.end-=Math.max(1,CH.n*0.1);draw()}else if(k==='ArrowRight'){CH.end+=Math.max(1,CH.n*0.1);draw()}else if(k==='ArrowDown'||k==='ArrowUp'){const vis=[...document.querySelectorAll('.wr')];const i=vis.findIndex(x=>x.dataset.c===S.ui.sym);const nx=vis[i+(k==='ArrowDown'?1:-1)];if(nx){e.preventDefault();loadSym(nx.dataset.c);nx.scrollIntoView({block:'nearest'})}}});
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement);window.addEventListener('resize',resize);
if(!S.watch.find(w=>w.code===S.ui.sym))S.ui.sym=S.watch[0].code;
async function pollLive(){if(!/^https?:/.test(location.protocol)||!BAKED)return;try{const r=await fetch('live.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j||!j.q)return;if(j.at===LIVE.at)return;LIVE=j;Object.entries(j.q).forEach(([code,x])=>{const b=BAKED.bars[code];if(!b||!x.p)return;const row=[x.t,x.o||x.p,Math.max(x.h||x.p,x.p),Math.min(x.l||x.p,x.p),x.p,x.v||0];if(b[b.length-1][0]===row[0])b[b.length-1]=row;else if(row[0]>b[b.length-1][0])b.push(row)});const keepN=CH.n,keepE=CH.end,len=CH.bars.length;CACHE={};setupChart(false);CH.n=keepN;CH.end=keepE+(CH.bars.length-len);draw();renderWL();renderRight();setMode();document.querySelectorAll('.wr').forEach(r=>{r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')});status('LIVE 현재가 갱신 '+j.at.slice(11)+' · '+Object.keys(j.q).length+'종목')}catch(e){}}
if(BAKED&&BAKED.picks){const L0=(BAKED.picks[pm()]||{})[pc()]||[];if(L0.length)S.ui.sym=L0[0]}setupPicks();setMode();renderAll();resize();startTimer();pollLive();setInterval(pollLive,20000);

// ================= 모바일 · GitHub 연동 =================
(function(){
 // 업데이트 시각 표시 + GitHub Pages에서 열렸으면 '지금 업데이트' 버튼(Actions 실행 화면으로 이동)
 const hd=document.querySelector('header');
 const h=location.hostname;
 if(/\.github\.io$/.test(h)){const user=h.split('.')[0];const repo=location.pathname.split('/').filter(Boolean)[0]||(user+'.github.io');
  const a=document.createElement('a');a.id='ghUp';a.style.display='inline-block';a.target='_blank';a.rel='noopener';
  a.href='https://github.com/'+user+'/'+repo+'/actions/workflows/daily.yml';a.textContent='⟳ 지금 업데이트';hd.appendChild(a)}
 // 터치 → 마우스 이벤트 변환 (한 손가락 드래그 = 이동/작도, 두 손가락 = 확대·축소, 두 번 탭 = 화면 맞춤)
 const cv=document.getElementById('cv');let pinch=0,lastTap=0;
 const mk=(type,t)=>new MouseEvent(type,{clientX:t.clientX,clientY:t.clientY,bubbles:true,cancelable:true,button:0,buttons:1});
 const dist=ts=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
 cv.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2){window.dispatchEvent(mk('mouseup',e.touches[0]));pinch=dist(e.touches);return}
  const t=e.touches[0];const now=Date.now();if(now-lastTap<300){cv.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));lastTap=0;return}lastTap=now;
  cv.dispatchEvent(mk('mousemove',t));cv.dispatchEvent(mk('mousedown',t))},{passive:false});
 cv.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2&&pinch){const d=dist(e.touches);if(Math.abs(d-pinch)>12){const c={clientX:(e.touches[0].clientX+e.touches[1].clientX)/2,clientY:(e.touches[0].clientY+e.touches[1].clientY)/2};cv.dispatchEvent(new WheelEvent('wheel',{clientX:c.clientX,clientY:c.clientY,deltaY:d>pinch?-100:100,bubbles:true,cancelable:true}));pinch=d}return}
  cv.dispatchEvent(mk('mousemove',e.touches[0]))},{passive:false});
 cv.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length===0){pinch=0;const t=e.changedTouches[0];window.dispatchEvent(mk('mouseup',t));cv.dispatchEvent(new MouseEvent('mouseleave'))}},{passive:false});
 // 휴대폰에서 종목을 누르면 차트로 스크롤
 const toChart=ev=>{if(window.innerWidth>900)return;const row=ev.target.closest('.wr,tbody tr');if(row)setTimeout(()=>document.getElementById('center').scrollIntoView({behavior:'smooth',block:'start'}),60)};
 document.getElementById('wlList').addEventListener('click',toChart);document.getElementById('bc').addEventListener('click',toChart);
})();
</script></body></html>
