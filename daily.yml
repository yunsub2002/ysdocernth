name: VALUE HTS 업데이트

on:
  schedule:
    # GitHub cron은 UTC 기준 (한국시간 = UTC+9). GitHub 사정으로 수~수십 분 늦게 시작될 수 있음
    - cron: '17 22 * * 0-4'       # 월~금 07:17 KST  추천종목 전체 재스캔 (미국장 마감 후)
    - cron: '47 7 * * 1-5'        # 월~금 16:47 KST  추천종목 전체 재스캔 (한국장 마감 후)
    - cron: '*/15 0-6 * * 1-5'    # 한국장 중 15분마다 추천종목 현재가
    - cron: '*/15 13-21 * * 1-5'  # 미국장 중 15분마다 추천종목 현재가
  workflow_dispatch:              # 화면의 '⟳ 추천 다시 뽑기' → Run workflow
    inputs:
      mode:
        description: 'scan = 추천종목 새로 뽑기(10분) / quotes = 현재가만(1분)'
        type: choice
        options: [scan, quotes]
        default: scan

permissions:
  contents: write
  pages: write

concurrency:
  group: value-hts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 추천종목 스캔 또는 현재가 갱신
        run: |
          S="${{ github.event.schedule }}"; M="${{ github.event.inputs.mode }}"
          if [ "$M" = "scan" ] || [ "$S" = "17 22 * * 0-4" ] || [ "$S" = "47 7 * * 1-5" ]; then
            python update_dashboard.py --nobrowser
          else
            python update_dashboard.py --quotes --nobrowser
          fi

      - name: 결과 저장 (index.html · live.json)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html live.json
          git commit -m "update $(date '+%Y-%m-%d %H:%M KST')" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

      - name: GitHub Pages 새로 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 자동 게시 요청 생략"
